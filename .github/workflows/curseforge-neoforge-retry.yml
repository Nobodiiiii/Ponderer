name: Inspect CurseForge public file pages

on:
  push:
    branches: [codex/curseforge-neoforge-retry-20261118]
    paths: [.github/workflows/curseforge-neoforge-retry.yml]

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public CurseForge pages
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import html
          import json
          import re
          import urllib.error
          import urllib.request

          pages = [
              ("Fabric Lib", "ponderer-lib", 9681316),
              ("Fabric product", "the-ponderer", 9681336),
              ("NeoForge Lib", "ponderer-lib", 9681373),
              ("NeoForge product", "the-ponderer", 9681377),
              ("Published Lib control", "ponderer-lib", 9635781),
          ]
          def check(item):
              label, slug, file_id = item
              url = f"https://www.curseforge.com/minecraft/mc-mods/{slug}/files/{file_id}"
              request = urllib.request.Request(url, headers={"User-Agent": "Ponderer-release-verification/1.0", "Cache-Control": "no-cache"})
              try:
                  response = urllib.request.urlopen(request, timeout=20)
              except urllib.error.HTTPError as error:
                  response = error
              except Exception as error:
                  return {"label": label, "error": type(error).__name__}
              with response:
                  text = response.read().decode("utf-8", errors="replace")
                  titles = re.findall(r"<title[^>]*>(.*?)</title>", text, re.S)
                  result = {"label": label, "id": file_id, "http": response.status, "url": response.geturl(), "challenge": response.headers.get("cf-mitigated"), "title": html.unescape(titles[0]) if titles else None}
                  next_data = re.search(r'<script[^>]*id="__NEXT_DATA__"[^>]*>(.*?)</script>', text, re.S)
                  if next_data:
                      try:
                          data = json.loads(next_data.group(1))
                          matches = []
                          def visit(value):
                              if isinstance(value, dict):
                                  if value.get("id") == file_id or value.get("fileId") == file_id:
                                      matches.append({key: value[key] for key in ("id", "fileId", "fileName", "name", "fileStatus", "status", "isAvailable", "isApproved", "isPublic", "dateReleased") if key in value})
                                  for child in value.values(): visit(child)
                              elif isinstance(value, list):
                                  for child in value: visit(child)
                          visit(data)
                          result["metadata"] = matches
                      except ValueError:
                          result["metadata_error"] = True
                  return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              for result in pool.map(check, pages):
                  print("FILE_STATUS " + json.dumps(result, ensure_ascii=False), flush=True)
          PY
