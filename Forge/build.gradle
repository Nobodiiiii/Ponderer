plugins {
    id "idea"
    id "eclipse"
    id "com.diffplug.eclipse.apt" version "4.4.1"
    id "net.minecraftforge.gradle" version "[6.0, 6.2)"
    id "org.spongepowered.mixin" version "0.7-SNAPSHOT"
    id "org.parchmentmc.librarian.forgegradle" version "${librarian_version}"
    id "com.nododiiiii.ponderer.gradle"
}

def commonProject = project(":Common")

base {
    archivesName = "${mod_id}-${minecraft_version}-forge"
}

// -- Mixin Support
mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")
    config("${mod_id}.mixins.json")
}

minecraft {
    if (Boolean.parseBoolean(project.use_parchment)) {
        mappings channel: "parchment", version: "${parchment_version}-${minecraft_version}"
    } else {
        mappings channel: "official", version: "${minecraft_version}"
    }

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file("../run")

            property "forge.logging.markers", "REGISTRIES"
            property "forge.logging.console.level", "debug"
            property "mixin.env.remapRefMap", "true"
            property "mixin.env.refMapRemappingFile", "${projectDir}/build/createSrgToMcp/output.srg"

            arg "-mixin.config=${mod_id}.mixins.json"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source commonProject.sourceSets.main
                }
            }
        }

        client {
            taskName "Client"
        }

        server {
            taskName "Server"
            args '--nogui'
        }

        data {
            taskName "Data"
            args '--mod', mod_id, '--all',
                 '--output', file('src/generated/resources/').getAbsolutePath(),
                 '--existing', file('src/main/resources/').getAbsolutePath(),
                 '--existing', commonProject.file('src/main/resources/').getAbsolutePath()
        }
    }
}

// Enable jarJar to bundle Ponder + Flywheel
jarJar.enable()

dependencies {
    minecraft("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    compileOnly(commonProject)

    // Ponder - compile/runtime + jarJar bundle
    implementation(fg.deobf("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"))
    jarJar(group: "net.createmod.ponder", name: "Ponder-Forge-${minecraft_version}", version: "[${ponder_version},)") {
        exclude group: "dev.engine-room.flywheel"
    }

    // Flywheel - API for compile, full mod for jarJar
    compileOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}"))
    runtimeOnly(fg.deobf("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}"))
    jarJar(group: "dev.engine-room.flywheel", name: "flywheel-forge-${minecraft_version}", version: "[${flywheel_version},)")

    // JEI
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"))
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"))
    runtimeOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}"))

    // Mixin AP
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")
}

// Merge Common source into Forge compilation
tasks.named("compileJava", JavaCompile).configure {
    source(commonProject.sourceSets.main.allSource)
}
tasks.withType(Javadoc).configureEach {
    source(commonProject.sourceSets.main.allJava)
}
tasks.matching { it.name == "sourcesJar" && it instanceof Jar }.configureEach {
    from(commonProject.sourceSets.main.allSource)
}
processResources {
    from commonProject.sourceSets.main.resources
}

// Template-based mod metadata (mods.toml)
def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def expandProps = [
        version                 : mod_version,
        group                   : mod_group_id,
        minecraft_version       : minecraft_version,
        forge_version           : forge_version,
        forge_version_range     : forge_version_range,
        minecraft_version_range : minecraft_version_range,
        loader_version_range    : loader_version_range,
        mod_id                  : mod_id,
        mod_name                : mod_name,
        mod_license             : mod_license,
        mod_version             : mod_version,
        mod_authors             : mod_authors,
        mod_description         : mod_description
    ]
    inputs.properties expandProps
    expand expandProps
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata

jar.finalizedBy("reobfJar")

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IntelliJ Mixin annotation processor workaround
if (System.getProperty("idea.sync.active") == "true") {
    afterEvaluate {
        tasks.withType(JavaCompile).all {
            it.options.annotationProcessorPath = files()
        }
    }
}
