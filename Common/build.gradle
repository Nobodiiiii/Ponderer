plugins {
    id "org.spongepowered.gradle.vanilla" version "0.2.1-SNAPSHOT"
}

base {
    archivesName = "${mod_id}-Common-${minecraft_version}"
}

minecraft {
    version(minecraft_version)
    // accessWideners("src/main/resources/${mod_id}.accesswidener")
}

dependencies {
    compileOnly group: "org.spongepowered", name: "mixin", version: "0.8.5"

    // ForgeConfigSpec on Common (Fabric uses ForgeConfigAPIPort to provide it)
    implementation "com.electronwill.night-config:core:3.6.5"
    implementation "com.electronwill.night-config:toml:3.6.5"
    compileOnly "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"

    // Ponder & Flywheel common APIs
    compileOnly "net.createmod.ponder:Ponder-Common-${minecraft_version}:${ponder_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-common-mojmap-api-${minecraft_version}:${flywheel_version}"

    // JEI common API
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"

    // Resourcify (optional, for Modrinth resource pack browsing)
    compileOnly "maven.modrinth:resourcify:${resourcify_version}"

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
}

java {
    withSourcesJar()
}

tasks.withType(Test).configureEach {
    enabled = true
    useJUnitPlatform()
    if (project.hasProperty("realLlm")) {
        systemProperty "ponderer.realLlm", project.property("realLlm").toString()
    }
}
