// Root build.gradle — Ponderer multi-platform (Lotus architecture)
// Subprojects: Common, NeoForge, Fabric

plugins {
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.1.8" apply false
}

tasks.withType(Test).configureEach {
    it.enabled = false
}

subprojects {
    apply plugin: "java-library"
    apply plugin: "maven-publish"
    apply plugin: "idea"

    version = mod_version
    group = mod_group_id

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    dependencies {
        compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        outputs.cacheIf { false }
    }

    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
            content {
                includeGroup "net.fabricmc"
                includeGroup "net.fabricmc.fabric-api"
            }
        }
        maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
        maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
        maven { url = "https://maven.createmod.net" }
        maven { url = "https://maven.blamejared.com" }
        maven { url = "https://maven.terraformersmc.com/releases/" }
        maven { url = "https://mvn.devos.one/snapshots/" }
        maven { url = "https://mvn.devos.one/releases/" }
        maven { url = "https://maven.neoforged.net/releases" }
        maven { url = "https://maven.parchmentmc.org" }
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth"
            }
        }
    }

    // Token expansion for mod metadata files
    processResources {
        def expandProps = [
            "version"                   : mod_version,
            "group"                     : mod_group_id,
            "minecraft_version"         : minecraft_version,
            "neo_version"               : neo_version,
            "neo_version_range"         : neo_version_range,
            "minecraft_version_range"   : minecraft_version_range,
            "fabric_version"            : fabric_version,
            "fabric_loader_version"     : fabric_loader_version,
            "loader_version_range"      : loader_version_range,
            "mod_name"                  : mod_name,
            "mod_id"                    : mod_id,
            "mod_authors"               : mod_authors,
            "mod_description"           : mod_description,
            "mod_license"               : mod_license,
            "mod_version"               : mod_version,
            "jei_version"               : jei_version
        ]

        filesMatching(["pack.mcmeta", "fabric.mod.json", "META-INF/neoforge.mods.toml", "*.mixins.json"]) {
            expand expandProps
        }
        inputs.properties(expandProps)
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}

// ─── Quickplay client tasks ─────────────────────────────────────────────────
def configureQuickPlayTask = { Exec task, String targetName, boolean onlineBuild ->
    task.group = 'mod development'
    task.description = onlineBuild
            ? "Runs test.py with an online Gradle build, copies the mod jars, and quickplays ${targetName}."
            : "Runs test.py with an offline Gradle build, copies the mod jars, and quickplays ${targetName}."
    task.workingDir = projectDir

    def command = [project.findProperty('pythonExecutable') ?: 'python', 'test.py', targetName]
    if (onlineBuild) {
        command += ['--online-build']
    }
    if (project.hasProperty('world')) {
        command += ['--world', project.property('world').toString()]
    }
    if (project.hasProperty('skipBuild')) {
        command += ['--skip-build']
    }
    if (project.hasProperty('noCopy')) {
        command += ['--no-copy']
    }
    if (project.hasProperty('dryRun')) {
        command += ['--dry-run']
    }
    if (project.hasProperty('width')) {
        command += ['--width', project.property('width').toString()]
    }
    if (project.hasProperty('height')) {
        command += ['--height', project.property('height').toString()]
    }

    task.commandLine command
}

tasks.register('quickPlayFabric', Exec) {
    configureQuickPlayTask(delegate, 'fabric', false)
}

tasks.register('quickPlayForge', Exec) {
    configureQuickPlayTask(delegate, 'forge', false)
}

tasks.register('quickPlayBoth', Exec) {
    configureQuickPlayTask(delegate, 'both', false)
}

tasks.register('quickPlayFabricOnline', Exec) {
    configureQuickPlayTask(delegate, 'fabric', true)
}

tasks.register('quickPlayForgeOnline', Exec) {
    configureQuickPlayTask(delegate, 'forge', true)
}

tasks.register('quickPlayBothOnline', Exec) {
    configureQuickPlayTask(delegate, 'both', true)
}
