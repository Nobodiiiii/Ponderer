// Root build.gradle — Ponderer multi-platform (Lotus architecture)
// Subprojects: Common, NeoForge, Fabric

plugins {
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.1.8" apply false
}

tasks.withType(Test).configureEach {
    it.enabled = false
}

subprojects {
    apply plugin: "java-library"
    apply plugin: "maven-publish"
    apply plugin: "idea"

    version = mod_version
    group = mod_group_id

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    dependencies {
        compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        outputs.cacheIf { false }
    }

    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
            content {
                includeGroup "net.fabricmc"
                includeGroup "net.fabricmc.fabric-api"
            }
        }
        maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
        maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
        maven { url = "https://maven.createmod.net" }
        maven { url = "https://maven.blamejared.com" }
        maven { url = "https://maven.terraformersmc.com/releases/" }
        maven { url = "https://mvn.devos.one/snapshots/" }
        maven { url = "https://mvn.devos.one/releases/" }
        maven { url = "https://maven.neoforged.net/releases" }
        maven { url = "https://maven.parchmentmc.org" }
    }

    // Token expansion for mod metadata files
    processResources {
        def expandProps = [
            "version"                   : mod_version,
            "group"                     : mod_group_id,
            "minecraft_version"         : minecraft_version,
            "neo_version"               : neo_version,
            "neo_version_range"         : neo_version_range,
            "minecraft_version_range"   : minecraft_version_range,
            "fabric_version"            : fabric_version,
            "fabric_loader_version"     : fabric_loader_version,
            "loader_version_range"      : loader_version_range,
            "mod_name"                  : mod_name,
            "mod_id"                    : mod_id,
            "mod_authors"               : mod_authors,
            "mod_description"           : mod_description,
            "mod_license"               : mod_license,
            "mod_version"               : mod_version,
            "jei_version"               : jei_version
        ]

        filesMatching(["pack.mcmeta", "fabric.mod.json", "META-INF/neoforge.mods.toml", "*.mixins.json"]) {
            expand expandProps
        }
        inputs.properties(expandProps)
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}
